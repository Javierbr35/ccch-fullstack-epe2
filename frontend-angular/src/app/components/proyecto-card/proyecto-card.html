<article class="proy-card"><div class="proy-top"><span class="codigo-pill">{{ proyecto().codigo }}</span><span class="estado-pill" [attr.data-estado]="proyecto().estado">{{ proyecto().estado_display }}</span></div><span class="area-label">{{ proyecto().area_display }}</span><h3>{{ proyecto().titulo }}</h3><p class="resumen">{{ proyecto().resumen }}</p><div class="proy-details"><div><span class="detail-title">Investigador(a) Principal</span><strong>{{ proyecto().investigador_principal }}</strong></div><div><span class="detail-title">Financiamiento</span><strong>${{ proyecto().presupuesto_clp | number:"1.0-0" }} CLP</strong></div></div></article>
